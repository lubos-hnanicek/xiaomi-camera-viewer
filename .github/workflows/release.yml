name: Release

on:
  push:
    tags: ['v*']
  # A dispatch run builds, tests and packages without creating a release.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  RELEASING: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  release:
    # The project needs the Visual Studio 2026 toolset.
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            msystem: UCRT64
            toolchain: mingw-w64-ucrt-x86_64-toolchain
          - architecture: arm64
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm-tools

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Set up bridge toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.toolchain }}

      - name: Add bridge toolchain to PATH
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bins = if ('${{ matrix.architecture }}' -eq 'x64') {
            @(Join-Path $env:MSYS2_LOCATION 'ucrt64\bin')
          } else {
            @(
              (Join-Path $env:MSYS2_LOCATION 'clang64\bin'),
              (Join-Path $env:MSYS2_LOCATION 'clangarm64\bin')
            )
          }
          foreach ($bin in $bins) { Add-Content -Path $env:GITHUB_PATH -Value $bin }
          Add-Content -Path $env:GITHUB_ENV -Value "MSYS2_LOCATION=$env:MSYS2_LOCATION"

      # Deliberately not cached, unlike CI. fetch-deps.ps1 checks each download
      # against a pinned hash but skips anything already on disk, so a cache hit
      # would mean a release linking dependencies that were verified once, some
      # time ago, by some other workflow run. A fresh download costs a few
      # seconds and re-verifies every hash.
      - name: Fetch dependencies
        run: .\scripts\fetch-deps.ps1 -Architecture $env:TARGET_ARCHITECTURE
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}

      - name: Resolve version
        id: version
        run: |
          $version = & .\scripts\get-version.ps1
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8
          Write-Host "project version $version"

      # The zip names, the version resource and the release title all come from
      # CMakeLists.txt, so a tag that disagrees with it could publish a release
      # full of files that identify themselves as another version.
      - name: Check the tag matches the project version
        if: env.RELEASING == 'true'
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED: v${{ steps.version.outputs.version }}
        run: |
          if ($env:TAG -ne $env:EXPECTED) {
            throw "Tag $env:TAG does not match the project version ($env:EXPECTED). Bump the version in CMakeLists.txt or retag."
          }
          Write-Host "tag $env:TAG matches the project version"

      - name: Build
        run: .\scripts\build.ps1 -Architecture $env:TARGET_ARCHITECTURE -Configuration RelWithDebInfo -Jobs 4
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}

      - name: Native recording tests
        if: matrix.architecture == 'x64'
        run: ctest --test-dir $env:BUILD_DIR -C RelWithDebInfo --output-on-failure
        env:
          BUILD_DIR: ${{ matrix.architecture == 'x64' && 'build/msvc' || 'build/msvc-arm64' }}

      - name: Bridge tests
        if: matrix.architecture == 'x64'
        run: go test ./...
        working-directory: bridge

      - name: Bridge ABI tests
        if: matrix.architecture == 'x64'
        run: .\scripts\test-bridge-abi.ps1 -Architecture $env:TARGET_ARCHITECTURE
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}

      - name: Check version metadata
        run: .\scripts\check-metadata.ps1 -Architecture $env:TARGET_ARCHITECTURE -Configuration RelWithDebInfo
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}

      - name: Package
        run: .\scripts\package.ps1 -Architecture $env:TARGET_ARCHITECTURE -Configuration RelWithDebInfo -RequireSymbols
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}

      - name: Upload the release archives
        uses: actions/upload-artifact@v7
        with:
          name: XiaomiViewer-${{ steps.version.outputs.version }}-win-${{ matrix.architecture }}
          path: dist/XiaomiViewer-${{ steps.version.outputs.version }}-win-${{ matrix.architecture }}*.zip
          if-no-files-found: error

  # One publisher job owns the draft release so the two matrix legs cannot
  # race while attaching their archives.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          $version = & .\scripts\get-version.ps1
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8

      - name: Download release archives
        uses: actions/download-artifact@v7
        with:
          pattern: XiaomiViewer-${{ steps.version.outputs.version }}-win-*
          path: dist
          merge-multiple: true

      # Left as a draft on purpose: the notes are worth writing by hand, and a
      # release that publishes itself is one that cannot be reconsidered.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:TAG `
            --draft `
            --title "Xiaomi Camera Viewer $env:VERSION" `
            --generate-notes `
            "dist/XiaomiViewer-$env:VERSION-win-x64.zip" `
            "dist/XiaomiViewer-$env:VERSION-win-x64-symbols.zip" `
            "dist/XiaomiViewer-$env:VERSION-win-arm64.zip" `
            "dist/XiaomiViewer-$env:VERSION-win-arm64-symbols.zip"