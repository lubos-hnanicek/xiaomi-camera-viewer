name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Stated rather than left implicit: every step here runs a PowerShell script
    # from scripts/, so which PowerShell is not an incidental detail.
    shell: pwsh

jobs:
  build:
    # Pinned rather than windows-latest: the project needs the Visual Studio 2026
    # toolset, and a release has to be reproducible, which a moving label is not.
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      # Keyed on fetch-deps.ps1 because that is where the pinned versions and
      # hashes live, so bumping a dependency invalidates the cache by itself.
      - name: Cache third-party dependencies
        uses: actions/cache@v6
        with:
          path: third_party
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/fetch-deps.ps1') }}

      - name: Fetch dependencies
        run: .\scripts\fetch-deps.ps1

      - name: Resolve version
        id: version
        run: |
          $version = & .\scripts\get-version.ps1
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8

      - name: Build
        run: .\scripts\build.ps1 -Configuration RelWithDebInfo -Jobs 4

      - name: Bridge tests
        run: go test ./...
        working-directory: bridge

      - name: Bridge ABI tests
        run: .\scripts\test-bridge-abi.ps1

      # Keep the executable and bridge version resources consistent with the
      # package name produced from the project version.
      - name: Check version metadata
        run: .\scripts\check-metadata.ps1 -Configuration RelWithDebInfo

      - name: Package
        run: .\scripts\package.ps1 -Configuration RelWithDebInfo

      # So a branch or a pull request can be tried without building it locally.
      # Project binaries are unsigned, so Windows may warn on first run.
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: XiaomiViewer-${{ steps.version.outputs.version }}-win-x64-unsigned
          path: dist/*.zip
          if-no-files-found: error
          # Short, because this is a build to try rather than a build to keep,
          # and every push would otherwise leave 50 MB behind for three months.
          retention-days: 14
